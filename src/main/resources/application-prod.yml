server:
  forward-headers-strategy: framework

spring:
  servlet:
    multipart:
      max-file-size: 20MB
      max-request-size: 25MB

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false

logging:
  level:
    com.iitsaii.photobooth: info
