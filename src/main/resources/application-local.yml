spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5544}/${DB_NAME:photobooth}
    username: ${DB_USERNAME:photobooth}
    password: ${DB_PASSWORD:photobooth}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true

logging:
  level:
    com.iitsaii.photobooth: debug
