services:
  app:
    image: ${DOCKERHUB_USERNAME:?DOCKERHUB_USERNAME is required}/photobooth:latest
    container_name: photobooth-app
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: prod
      DB_URL: ${DB_URL:?DB_URL is required}
      DB_USERNAME: ${DB_USERNAME:?DB_USERNAME is required}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      TOSS_SECRET_KEY: ${TOSS_SECRET_KEY:?TOSS_SECRET_KEY is required}
      AWS_ACCESS_KEY: ${AWS_ACCESS_KEY:?AWS_ACCESS_KEY is required}
      AWS_SECRET_KEY: ${AWS_SECRET_KEY:?AWS_SECRET_KEY is required}
      AWS_REGION: ${AWS_REGION:?AWS_REGION is required}
      AWS_S3_BUCKET_NAME: ${AWS_S3_BUCKET_NAME:?AWS_S3_BUCKET_NAME is required}
      # 비어 있으면 Sentry SDK가 자동으로 비활성화되므로, 다른 값들과 달리 필수로 강제하지 않는다.
      SENTRY_DSN: ${SENTRY_DSN:-}
      # 새 도메인 추가 시 코드 수정 없이 호스트의 CORS_ALLOWED_ORIGINS 환경변수만 바꾸면 된다.
      # (빈 문자열로 오버라이드되면 CORS가 전부 막히므로, 기본값을 명시해 둔다.)
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:3000,http://localhost:5173,https://itsai.co.kr,https://www.itsai.co.kr,https://prod.itsai.co.kr}
