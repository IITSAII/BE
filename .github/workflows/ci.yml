name: CI

on:
  pull_request:
    branches: [ develop ]

jobs:
  build:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: photobooth
          POSTGRES_USER: photobooth
          POSTGRES_PASSWORD: photobooth
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: 체크아웃
        uses: actions/checkout@v4

      - name: JDK 17 설정
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Gradle 설정 (캐시 포함)
        uses: gradle/actions/setup-gradle@v4

      - name: 빌드 및 테스트
        env:
          SPRING_PROFILES_ACTIVE: local
          SPRING_DATASOURCE_URL: jdbc:postgresql://localhost:5432/photobooth
          SPRING_DATASOURCE_USERNAME: photobooth
          SPRING_DATASOURCE_PASSWORD: photobooth
          TOSS_SECRET_KEY: test_dummy_key_for_ci_context_loading
        run: ./gradlew build
