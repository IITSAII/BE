plugins {
	id 'java'
	id 'org.springframework.boot' version '4.1.1'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.iitsaii'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(17)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-webmvc'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.5'
	compileOnly 'org.projectlombok:lombok'
	runtimeOnly 'org.postgresql:postgresql'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-data-jpa-test'
	testImplementation 'org.springframework.boot:spring-boot-starter-webmvc-test'
	testCompileOnly 'org.projectlombok:lombok'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testAnnotationProcessor 'org.projectlombok:lombok'

	implementation platform("software.amazon.awssdk:bom:2.34.0")
	implementation "software.amazon.awssdk:s3"

	// Spring Boot 4 전용 아티팩트. sentry-spring-boot-starter-jakarta는 Spring Boot 3용이라
	// 이 프로젝트(Spring Boot 4.1.1)에서는 RestClientCustomizer 클래스를 찾지 못해 기동이 실패한다.
	// sentry.dsn이 비어있으면 자동으로 비활성화된다.
	implementation 'io.sentry:sentry-spring-boot-4:8.56.0'
}

tasks.named('test') {
	useJUnitPlatform()
	// 우선순위: -Dspring.profiles.active > SPRING_PROFILES_ACTIVE 환경변수 > local(기본값)
	// CI(ci.yml)는 SPRING_PROFILES_ACTIVE=local과 함께 datasource를 env로 덮어써서 주입하므로 영향 없다.
	systemProperty 'spring.profiles.active',
			System.getProperty('spring.profiles.active', System.getenv('SPRING_PROFILES_ACTIVE') ?: 'local')
}

tasks.named('bootRun') {
	// 우선순위: -Dspring.profiles.active > SPRING_PROFILES_ACTIVE 환경변수 > local(기본값)
	systemProperty 'spring.profiles.active',
			System.getProperty('spring.profiles.active', System.getenv('SPRING_PROFILES_ACTIVE') ?: 'local')
}
